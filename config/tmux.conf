#=============================================================================
#  Ferrox — config/tmux.conf (status bar minimaliste)
#-----------------------------------------------------------------------------
#  Status bar en bas, fond gris foncé (colour234), dégradé statique avec les
#  3 couleurs du thème « rouge » par défaut :
#    rouge (160) → secteur session      (couleur dominante = cadre du prompt)
#    marron (94) → fenêtres inactives
#    crème (223) → horloge              (segment droit)
#  Copié vers ~/.tmux.conf par install_shell_environment si absent (jamais
#  écrasé si le fichier cible existe déjà).
#=============================================================================

# --- Apparence générale : terminal 256 couleurs, fond sombre ---
set -g default-terminal "screen-256color"
set -g status-style bg=colour234

# --- Status bar en bas ---
set -g status-position bottom

# --- Segment gauche : nom de session (rouge, couleur dominante) ---
set -g status-left "[#S]"
set -g status-left-style fg=colour160,bg=colour234

# --- Fenêtres : inactive marron / active rouge dominant ---
set -g window-status-format " #I:#W "
set -g window-status-style fg=colour94,bg=colour234
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg=colour160,bg=colour234
set -g window-status-separator " "

# --- Segment droit : date et heure (crème) ---
set -g status-right "%H:%M:%S"
set -g status-right-style fg=colour223,bg=colour234

# --- Dimensions des segments ---
set -g status-left-length 20
set -g status-right-length 40